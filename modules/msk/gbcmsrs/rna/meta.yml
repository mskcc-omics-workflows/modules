# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "gbcmsrs_rna"
description:
  Count alleles in RNA-seq BAMs at known variant sites with transcriptome-aware
  filtering using gbcms
keywords:
  - basecount
  - genotyping
  - rna
  - variants
tools:
  - "gbcms":
      description:
        "A high-performance, orientation-aware genotype counting system for
        genomic variants (Rust rewrite of GetBaseCountsMultiSample)"
      homepage: "https://github.com/msk-access/gbcms"
      documentation: "https://msk-access.github.io/gbcms/"
      tool_dev_url: "https://github.com/msk-access/gbcms"
      licence: ["AGPL-3.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - variants:
        type: file
        description: Input variant file in VCF or MAF format
        pattern: "*.{vcf,maf}"
        ontologies: []
    - bams:
        type: file
        description: One or more indexed RNA-seq BAM/CRAM files to count alleles in
        pattern: "*.{bam,cram}"
        ontologies: []
    - bais:
        type: file
        description: Index file(s) for the input BAM/CRAM file(s)
        pattern: "*.{bai,crai}"
        ontologies: []
  - fasta:
      type: file
      description: Reference genome FASTA file
      pattern: "*.{fasta,fa}"
      ontologies: []
  - fasta_fai:
      type: file
      description: Index of the reference genome FASTA file
      pattern: "*.fai"
      ontologies: []
  - gtf:
      type: file
      description:
        Optional GTF annotation file (Ensembl/GENCODE) enabling exon boundary
        and splice junction awareness. Pass an empty list (`[]`) to omit.
      pattern: "*.gtf"
      ontologies: []
  - rna_editing_db:
      type: file
      description:
        Optional REDIportal TABLE1 file of known A-to-I RNA editing sites.
        Pass an empty list (`[]`) to omit.
      pattern: "*.{txt,txt.gz}"
      ontologies: []
output:
  variant_file:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "gbcms_out/*.{vcf,maf}":
          type: file
          description:
            Variant file annotated with transcript-aware allele counts and
            RNA editing flags
          pattern: "gbcms_out/*.{vcf,maf}"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@shahr"
maintainers:
  - "@buehlere"
  - "@shahr"
