# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "phylowgs_multievolve"
description: Create trees from input from phylowgs_createinput
keywords:
  - phylowgs
  - CNVs
  - FACETs
tools:
  - "phylowgs_multievolve":
      description: "Program to create trees from input from phylowgs_createinput"
      homepage: "https://genomebiology.biomedcentral.com/articles/10.1186/s13059-015-0602-8"
      tool_dev_url: "https://github.com/mskcc/phylowgs"

      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - cnv_data:
        type: file
        description: copy number input data from phylowgs_createinput
        pattern: "*.{txt}"
    - ssm_data:
        type: file
        description: mutation input data from phylowgs_createinput
        pattern: "*.{txt}"
output:
  - trees:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - chains/trees.zip:
          type: file
          description: Zip file containing the completed trees
          pattern: "trees.zip"
  - summ:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.summ.json.gz":
          type: file
          description: Output file for JSON-formatted tree summaries
          pattern: "*.summ.json.gz"
  - muts:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.muts.json.gz":
          type: file
          description: Output file for JSON-formatted list of mutations
          pattern: "*.muts.json.gz"
  - mutass:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.mutass.zip":
          type: file
          description: Output file for JSON-formatted list of SSMs and CNVs
          pattern: "*.mutass.zip"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@nikhil"
maintainers:
  - "@nikhil"
