# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "neoantigenutils_generatehlastring"
description: Generate the hla string for netmhc tools
keywords:
  - neoantigen
  - string
  - netmhc
  - hla
tools:
  - neoantigen_utils:
      description: "Collection of helper scripts for neoantigen processing"
      documentation: "https://github.com/mskcc-omics-workflows/modules"
      licence: [""]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. `[ id:'sample1', single_end:false ]`
    - inputHLA:
        type: file
        description: |
          HLA typing result. Either a POLYSOLVER winners file (winners.hla.txt) or an
          HLA-HD final result file (*_final.result.txt). The format is detected from
          the file contents; no flag is needed.
        pattern: "*.{txt}"
output:
  - hlastring:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@johnoooh"
  - "@nikhil"
maintainers:
  - "@johnoooh"
  - "@nikhil"
