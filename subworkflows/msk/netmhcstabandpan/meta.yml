# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "netmhcstabandpan"
description: Run netmhcpan and netmhcstabpan in parallel.
keywords:
  - peptides
  - netmhc
  - neoantigen
  - tsv
components:
  - netmhc3
  - netmhcpan4
  - netmhcstabpan
  - neoantigenutils/formatnetmhcpan
input:
  - ch_fasta_and_hla:
      type: file
      description: |
        The input channel containing the fasta and hla files
        Structure: [ val(meta), path(mut_fasta), path(wt_fasta), path(hla) ]
      pattern: "*.{fa/txt}"
  - ch_sv_fasta:
      type: file
      description: |
        The input channel containing the structural variant fasta files
        Structure: [ val(meta), path(sv_mut_fasta), path(sv_wt_fasta) ]
      pattern: "*.{fa}"
output:
  - tsv:
      type: file
      description: |
        Channel containing TSV files
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.tsv"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@nikhil"
maintainers:
  - "@nikhil"
