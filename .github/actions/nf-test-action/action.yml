name: "nf-test Action"
description: "Runs nf-test with common setup steps"
inputs:
  profile:
    description: "Profile to use"
    required: true
  shard:
    description: "Shard number for this CI job"
    required: true
  total_shards:
    description: "Total number of test shards(NOT the total number of matrix jobs)"
    required: true
  paths:
    description: "Test paths"
    required: true
  jfrog_username:
    description: "JFrog registry username"
    required: false
    default: ""
  jfrog_password:
    description: "JFrog registry password or token"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Nextflow
      uses: nf-core/setup-nextflow@v2
      with:
        version: "${{ env.NXF_VERSION }}"

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
      with:
        python-version: "3.11"

    - name: Install cross-repo component dependencies
      shell: bash
      run: |
        mapfile -t metas < <(find subworkflows -name meta.yml)
        if (( ${#metas[@]} > 0 )); then
          bash .github/scripts/install-components.sh "${metas[@]}"
        fi

    - name: Install nf-test
      uses: nf-core/setup-nf-test@v1
      with:
        version: "${{ env.NFT_VER }}"
        install-pdiff: true

    - name: Setup apptainer
      if: contains(inputs.profile, 'singularity')
      uses: eWaterCycle/setup-apptainer@main

    - name: Set up Singularity
      if: contains(inputs.profile, 'singularity')
      shell: bash
      run: |
        mkdir -p $NXF_SINGULARITY_CACHEDIR
        mkdir -p $NXF_SINGULARITY_LIBRARYDIR

    - name: Conda setup
      if: ${{inputs.profile == 'conda'}}
      uses: conda-incubator/setup-miniconda@d2e6a045a86077fb6cad6f5adf368e9076ddaa8d # v3
      with:
        auto-update-conda: true
        conda-solver: libmamba
        conda-remove-defaults: true

    # Set up secrets
    - name: Set up nextflow secrets
      if: env.SENTIEON_ENCRYPTION_KEY != '' && env.SENTIEON_LICENSE_MESSAGE != ''
      shell: bash
      run: |
        python -m pip install cryptography
        nextflow secrets set SENTIEON_AUTH_DATA $(python3 tests/modules/nf-core/sentieon/license_message.py encrypt --key "$SENTIEON_ENCRYPTION_KEY" --message "$SENTIEON_LICENSE_MESSAGE")

    - name: Set up nextflow ONCOKB secrets
      if: env.ONCOKB_TOKEN != '' 
      shell: bash
      run: |
        nextflow secrets set ONCOKB_TOKEN $ONCOKB_TOKEN


    - name: Login to JFrog Container Registry (docker)
      if: ${{ inputs.profile == 'docker' && inputs.jfrog_username != '' }}
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
      with:
        registry: mskcc.jfrog.io
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}

    - name: Configure JFrog auth for Apptainer/Singularity
      if: ${{ contains(inputs.profile, 'singularity') && inputs.jfrog_username != '' }}
      shell: bash
      env:
        JFROG_USERNAME: ${{ inputs.jfrog_username }}
        JFROG_PASSWORD: ${{ inputs.jfrog_password }}
      run: |
        # Scope JFrog creds to mskcc.jfrog.io only via a Docker-format auth
        # file. Setting APPTAINER_DOCKER_USERNAME/PASSWORD globally would send
        # JFrog basic-auth to every docker:// pull (incl. ghcr.io, quay.io),
        # which the other registries reject with 403.
        AUTH=$(printf '%s:%s' "$JFROG_USERNAME" "$JFROG_PASSWORD" | base64 -w0)
        for d in "$HOME/.apptainer" "$HOME/.singularity"; do
          mkdir -p "$d"
          cat > "$d/docker-config.json" <<EOF
        {"auths":{"mskcc.jfrog.io":{"auth":"$AUTH"}}}
        EOF
          chmod 600 "$d/docker-config.json"
        done

      # TODO Skip failing conda tests and document their failures
      # https://github.com/nf-core/modules/issues/7017
    - name: Run nf-test
      id: run-nf-test
      shell: bash
      env:
        SENTIEON_LICSRVR_IP: ${{ env.SENTIEON_LICSRVR_IP }}
        SENTIEON_AUTH_MECH: "GitHub Actions - token"
      run: |
        NFT_WORKDIR=~

        nf-test test \
          --profile=${{ inputs.profile }} \
          --tap=test.tap \
          --verbose \
          --ci \
          --shard ${{ inputs.shard }}/${{ inputs.total_shards }} \
          --filter process,workflow \
          ${{ inputs.paths }}

          # Save the absolute path of the test.tap file to the output
          echo "tap_file_path=$(realpath test.tap)" >> $GITHUB_OUTPUT

    - name: Generate test summary
      if: ${{ failure() && steps.run-nf-test.conclusion == 'failure' }}
      shell: bash
      run: |
        # Add header if it doesn't exist (using a token file to track this)
        if [ ! -f ".summary_header" ]; then
          echo "# 🚀 nf-test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Test Name | Profile | Shard |" >> $GITHUB_STEP_SUMMARY
          echo "|:------:|-----------|---------|-------|" >> $GITHUB_STEP_SUMMARY
          touch .summary_header
        fi

        if [ -f test.tap ]; then
          while IFS= read -r line; do
            if [[ $line =~ ^ok ]]; then
              test_name="${line#ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ✅ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            elif [[ $line =~ ^not\ ok ]]; then
              test_name="${line#not ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ❌ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            fi
          done < test.tap
        else
          echo "| ⚠️ | No test results found | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Clean up
      if: always()
      shell: bash
      run: |
        sudo rm -rf /home/ubuntu/tests/
